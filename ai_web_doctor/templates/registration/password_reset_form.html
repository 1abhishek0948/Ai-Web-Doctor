{% extends "base.html" %}
{% load static %}

{% block title %}Reset password — AI Web Doctor{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16">
  <div class="rounded-2xl border border-slate-200 p-8 dark:border-slate-800">
    <h1 class="text-xl font-bold text-slate-900 dark:text-slate-100">Reset your password</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Enter your email and we'll send you a reset link.</p>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_email" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email address</label>
        <input type="email" name="email" id="id_email" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
      </div>
      {% for error in form.email.errors %}
        <p class="text-xs text-red-600 dark:text-red-400">{{ error }}</p>
      {% endfor %}
      <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-2.5 font-semibold text-white transition-colors hover:bg-brand-700">
        Send reset link
      </button>
    </form>
  </div>
</div>
{% endblock %}
