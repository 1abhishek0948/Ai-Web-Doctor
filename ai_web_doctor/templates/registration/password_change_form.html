{% extends "base.html" %}
{% load static %}

{% block title %}Change password — AI Web Doctor{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16">
  <div class="rounded-2xl border border-slate-200 p-8 dark:border-slate-800">
    <h1 class="text-xl font-bold text-slate-900 dark:text-slate-100">Change password</h1>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 dark:text-slate-300">{{ field.label }}</label>
          <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
          {% for error in field.errors %}
            <p class="mt-1 text-xs text-red-600 dark:text-red-400">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-2.5 font-semibold text-white transition-colors hover:bg-brand-700">
        Change password
      </button>
    </form>
  </div>
</div>
{% endblock %}
