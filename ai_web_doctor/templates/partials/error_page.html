{% load static %}
<div class="mx-auto flex min-h-[60vh] max-w-xl flex-col items-center justify-center px-4 py-16 text-center">
  <p class="font-mono text-sm font-semibold uppercase tracking-wide text-brand-600 dark:text-brand-400">
    Error {{ status }}
  </p>
  <h1 class="mt-3 text-3xl font-bold text-slate-900 dark:text-slate-100">{{ title }}</h1>
  <p class="mt-3 text-slate-500 dark:text-slate-400">{{ message }}</p>
  {% if limit %}
    <p class="mt-2 text-sm font-medium text-slate-400 dark:text-slate-500">Free accounts are limited to {{ limit }} scans per day.</p>
  {% endif %}  <a href="{% url 'landing' %}" class="mt-8 inline-flex items-center gap-2 rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
    {% include "partials/icon.html" with name="home" class="h-4 w-4" %}
    Back to home
  </a>
</div>
