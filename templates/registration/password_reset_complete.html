{% extends "base.html" %}
{% load static %}

{% block title %}Password reset complete — AI Web Doctor{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16 text-center">
  <h1 class="text-xl font-bold text-slate-900 dark:text-slate-100">Password reset complete</h1>
  <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Your password has been changed. You can now log in.</p>
  <a href="{% url 'login' %}" class="mt-6 inline-flex rounded-lg bg-brand-600 px-4 py-2.5 font-semibold text-white transition-colors hover:bg-brand-700">
    Log in
  </a>
</div>
{% endblock %}
