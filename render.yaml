# ============================================================================
# Render Blueprint Configuration (render.yaml)
# Use this to deploy AI Web Doctor to Render's Free Plan with a single click.
#
# Free tier memory is 512MB per instance. Chromium needs ~400MB alone.
# We run the scan in a short-lived subprocess (SCAN_SUBPROCESS_MODE) to ensure
# Chromium releases memory entirely after each scan.
#
# Render disabled Free Tier Background Workers on Jan 1, 2024, so everything
# must run within the Web service. To prevent OOM kills, we use extreme
# memory-saving flags for Chromium (CHROMIUM_LOW_MEMORY_MODE, SCAN_BLOCK_IMAGES).
# through Postgres instead of a broker. Without the web/worker split, the web
# process + Chromium exceed 512MB and the kernel OOM-kills the whole container
# mid-scan ("server restarted or ran out of memory").
# ============================================================================

databases:
  - name: ai-web-doctor-db
    plan: free
    region: oregon # Render databases are deployed in a specific region

services:
  # --- Web: serves the UI/API, queues scans for the worker ---------------
  - type: web
    name: ai-web-doctor
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render's free tier doesn't support preDeployCommand, so migrations run
    # inside the Dockerfile's CMD on startup. Gunicorn is optimized for 1
    # worker + 1 thread; the web process never launches Chromium.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-web-doctor-db
          property: connectionString

      - key: DEBUG
        value: "False"

      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

      - key: SITE_URL
        value: "https://ai-web-doctor.onrender.com"

      - key: SCAN_WORKER_MODE
        value: "False" # Web service runs the scan itself

      - key: SCAN_SUBPROCESS_MODE
        value: "True" # Run in a short-lived subprocess to release RAM

      - key: MAX_CONCURRENT_SCANS
        value: "1" # One scan at a time on low-RAM instances

      - key: SCAN_VIEWPORTS
        value: "[[390,844],[1440,900]]" # Mobile + desktop: 2 viewports to fit free-tier CPU/RAM

      - key: MAX_SCAN_DURATION
        value: "300" # 5-minute time budget for free-tier 2-viewport scans

      - key: SCAN_MAX_DURATION_SECONDS
        value: "300" # Hard kill deadline for the scan subprocess (watchdog)

      - key: MAX_SCREENSHOTS
        value: "4" # Each capture is a transient PNG spike; 4 keeps memory low

      - key: MAX_RESPONSE_SIZE
        value: "5242880"

      - key: SCAN_NETWORK_IDLE_TIMEOUT_MS
        value: "1500" # Fast 1.5s bounded idle wait per viewport

      - key: CHROMIUM_LOW_MEMORY_MODE
        value: "True" # Capped V8 heaps + no background services

      - key: CHROMIUM_V8_HEAP_MB
        value: "144" # 144MB V8 heap cap to fit strictly inside 512MB RAM container

      - key: SCAN_DOM_SNAPSHOT_LIMIT
        value: "80" # Cap DOM node elements to keep prompt size & RAM low

      - key: SCAN_BLOCK_HEAVY_RESOURCES
        value: "True" # Block fonts/media/trackers via CDP during scans

      - key: SCAN_BLOCK_IMAGES
        value: "True" # Crucial: Images drive transient memory, block them to avoid OOM

      - key: GEMINI_API_KEY
        sync: false # Prompts the user to input their Gemini API key on deployment

      - key: GEMINI_MODEL
        value: "gemini-2.0-flash" # Default recommended model (matches .env.example)

      - key: GEMINI_TIMEOUT_MS
        value: "60000" # 60s timeout to prevent AI provider timeout errors

      - key: AI_MAX_PROMPT_TOKENS
        value: "15000" # Lean prompt cap to accelerate Gemini response time

      - key: TRUST_X_FORWARDED_FOR
        value: "True" # Required behind Render's load balancer proxy for rate limits


