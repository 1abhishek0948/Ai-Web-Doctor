# ============================================================================
# Render Blueprint Configuration (render.yaml)
# Use this to deploy AI Web Doctor to Render's Free Plan with a single click.
# ============================================================================

databases:
  - name: ai-web-doctor-db
    plan: free
    region: oregon # Render databases are deployed in a specific region

services:
  - type: web
    name: ai-web-doctor
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    # Render's free tier doesn't support preDeployCommand, so migrations and startup 
    # are run inside the Dockerfile's CMD on startup. Gunicorn is optimized to run 
    # with 1 worker and 1 thread; scans run in a short-lived subprocess so Chromium
    # memory is released after every scan and an OOM never kills the web process.
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-web-doctor-db
          property: connectionString

      - key: DEBUG
        value: "False"

      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

      - key: SITE_URL
        value: "https://ai-web-doctor.onrender.com"

      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"

      - key: SCAN_SUBPROCESS_MODE
        value: "True" # Scans run in a child process: memory freed after each scan

      - key: SCAN_VIEWPORTS
        value: "[[320,800],[390,844],[768,1024],[1440,900]]" # 4 viewports to fit low-RAM hosts

      - key: MAX_CONCURRENT_SCANS
        value: "1" # One Chromium at a time on low-RAM instances

      - key: MAX_SCAN_DURATION
        value: "300" # Slower instance needs a longer budget than 120s

      - key: SCAN_MAX_DURATION_SECONDS
        value: "300" # Hard kill deadline for the scan subprocess (watchdog)

      - key: MAX_SCREENSHOTS
        value: "8"

      - key: SCAN_NETWORK_IDLE_TIMEOUT_MS
        value: "2000" # Short bounded idle wait per viewport

      - key: CHROMIUM_LOW_MEMORY_MODE
        value: "True" # Capped V8 heaps + no background services

      - key: SCAN_BLOCK_HEAVY_RESOURCES
        value: "True" # Block fonts/media/trackers via CDP during scans

      # Images drive most of Chromium's transient memory on media-heavy sites;
      # blocking them keeps peak RSS comfortably inside Render's 512MB free
      # plan even for sites like nytimes.com. Slight accuracy cost on
      # responsive checks only.
      - key: SCAN_BLOCK_IMAGES
        value: "True"

      - key: TRUST_X_FORWARDED_FOR
        value: "True" # Required behind Render's load balancer proxy for rate limits

      - key: GEMINI_API_KEY
        sync: false # Prompts the user to input their Gemini API key on deployment

      - key: GEMINI_MODEL
        value: "gemini-3.6-flash" # Default recommended model (matches .env.example)
